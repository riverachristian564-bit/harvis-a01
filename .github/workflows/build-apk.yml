name: Build HARVIS A01 APK

on:
  push:
    branches: [ main, mk1-v1.2-vosk-ui, mk1-v1.3-real-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Fetch Spanish Vosk model
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, os, shutil
          url='https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip'
          urllib.request.urlretrieve(url,'model.zip')
          with zipfile.ZipFile('model.zip') as z: z.extractall('modeltmp')
          src='modeltmp/vosk-model-small-es-0.42'; dst='app/src/main/assets/model-es'
          os.makedirs(os.path.dirname(dst),exist_ok=True)
          if os.path.exists(dst): shutil.rmtree(dst)
          shutil.copytree(src,dst); open(dst+'/uuid','w').write('harvis-mk1-es-042')
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HARVIS-Mark-I-Mobile-1.3-UI-VOICE.apk
      - name: Inspect APK
        run: |
          ls -lh HARVIS-Mark-I-Mobile-1.3-UI-VOICE.apk
          unzip -l HARVIS-Mark-I-Mobile-1.3-UI-VOICE.apk | grep -E 'libvosk|model-es|libjnidispatch|CoreVisualizer' | head -60
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HARVIS-MK1-1.3-UI-VOICE
          path: HARVIS-Mark-I-Mobile-1.3-UI-VOICE.apk
          if-no-files-found: error
